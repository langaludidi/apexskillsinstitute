<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Faculty Administration | Apex Skills Institute</title><link rel="stylesheet" href="/assets/v215.css"><style>body{margin:0;background:#f4f6fa;color:#172033;font-family:Arial,sans-serif}.admin-top{background:#07183d;color:#fff;padding:22px 0}.admin-shell{max-width:1240px;margin:auto;padding:24px}.admin-login{max-width:520px;margin:70px auto;background:#fff;padding:32px;border-radius:16px;border:1px solid #dfe5ef}.admin-login input,.admin-login button,.admin-filters input,.admin-filters select,.admin-filters button,.admin-detail-grid select,.admin-detail-grid textarea,.admin-detail-grid button{box-sizing:border-box;padding:11px 12px;border:1px solid #ccd5e3;border-radius:8px;font:inherit}.admin-login input{width:100%;margin:8px 0}.admin-login button,.admin-filters button,.admin-detail-grid button{background:#0A1B4A;color:#fff;font-weight:700;cursor:pointer}.admin-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.admin-stat{background:#fff;padding:18px;border-radius:12px;border:1px solid #dfe5ef}.admin-stat strong{display:block;font-size:1.7rem;color:#0A1B4A}.admin-stat span{text-transform:capitalize;color:#64748b}.admin-filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;background:#fff;padding:14px;border:1px solid #dfe5ef;border-radius:12px;margin-bottom:14px}.admin-table-wrap{overflow:auto;background:#fff;border:1px solid #dfe5ef;border-radius:12px}.admin-table{width:100%;border-collapse:collapse;min-width:800px}.admin-table th,.admin-table td{padding:13px;border-bottom:1px solid #e7ebf1;text-align:left}.admin-table th{font-size:.8rem;text-transform:uppercase;color:#64748b}.admin-table button{border:0;background:#eef3ff;color:#163c80;padding:8px 10px;border-radius:7px;cursor:pointer}.admin-detail{background:#fff;border:1px solid #dfe5ef;border-radius:14px;padding:22px;margin-top:18px}.admin-detail-head{display:flex;justify-content:space-between;gap:20px}.admin-detail-head h2{margin:.2rem 0}.admin-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.admin-detail-grid section{background:#f8fafc;padding:16px;border-radius:10px}.admin-detail-grid label{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.doc-link{display:block;margin:8px 0;color:#16458e}.admin-msg{padding:10px 0}.admin-msg.error{color:#a31d1d}.admin-user{display:flex;align-items:center;gap:12px}.admin-user button{padding:7px 10px}.top-grid{display:flex;justify-content:space-between;align-items:center}@media(max-width:800px){.admin-summary,.admin-filters,.admin-detail-grid{grid-template-columns:1fr}.top-grid{align-items:flex-start;gap:12px}.admin-shell{padding:16px}}</style></head><body><header class="admin-top"><div class="admin-shell top-grid"><div><strong>Apex Skills Institute</strong><div>Faculty Network Administration</div></div><div class="admin-user"><span id="admin-email"></span><button id="logout" type="button">Sign out</button></div></div></header><main class="admin-shell"><div id="admin-msg" class="admin-msg" aria-live="polite"></div><section id="admin-login" class="admin-login"><h1>Faculty Administration</h1><p>Authorised Apex administrators only. Sign in with a one-time code sent to your approved email address.</p><label>Email address<input id="login-email" type="email" autocomplete="email"></label><button id="otp-send" type="button">Send one-time code</button><div id="otp-box" hidden style="margin-top:18px"><label>One-time code<input id="otp-code" inputmode="numeric" autocomplete="one-time-code"></label><button id="otp-verify" type="button">Verify and sign in</button></div></section><section id="admin-app" hidden><h1>Faculty Network</h1><div id="summary" class="admin-summary"></div><div class="admin-filters"><input id="q" placeholder="Search name, email or expertise"><select id="status"><option value
