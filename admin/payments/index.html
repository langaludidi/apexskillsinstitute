<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payments & Accounts | Apex Skills Institute</title><link rel="stylesheet" href="/assets/learner-admin.css"></head><body><header class="top"><div class="shell topbar"><div><small>APEX SKILLS INSTITUTE</small><strong>Payments & Accounts</strong></div><div class="user"><a href="/admin/learners/" style="color:#fff">Learner Admin</a><span id="admin-email"></span><button id="logout">Sign out</button></div></div></header><main class="shell"><div id="msg" class="msg"></div><section id="login" class="login"><h1>Payments & Accounts</h1><p>Authorised Apex administrators only.</p><label>Email<input id="email" type="email" autocomplete="email"></label><button id="send">Send one-time code</button><div id="otp-wrap" hidden><label>One-time code<input id="otp" inputmode="numeric" autocomplete="one-time-code"></label><button id="verify">Verify and sign in</button></div></section><section id="app" hidden><div class="heading"><h1>Payments & Accounts</h1><p>Programme fees, payment schedules, receipts and learner balances.</p></div><div id="summary" class="summary"></div><div class="filters"><input id="q" placeholder="Search learner, enrolment or programme"><select id="balance"><option value="">All accounts</option><option value="outstanding">Outstanding balances</option><option value="settled">Settled accounts</option></select><span></span><button id="search">Search</button></div><div class="tablewrap"><table><thead><tr><th>Enrolment</th><th>Learner</th><th>Programme</th><th>Programme fee</th><th>Paid</th><th>Balance</th><th>Next due</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><section id="detail" class="detail"></section></section></main><div id="paymodal" class="modal" hidden><div class="modalcard"><div class="detailhead"><div><small>PAYMENT RECEIPT</small><h2>Record payment</h2><p id="pay-person"></p></div><button id="pay-close">Close</button></div><div class="grid" style="margin-top:18px"><label>Amount (R)<input id="pay-amount" type="number" min="0.01" step="0.01"></label><label>Payment method<select id="pay-method"><option value="eft">EFT</option><option value="card">Card</option><option value="cash_deposit">Cash deposit</option><option value="cash">Cash</option><option value="other">Other</option></select></label><label>External reference<input id="pay-ref" placeholder="Bank / gateway reference"></label><label>Schedule instalment<select id="pay-schedule"><option value="">Unallocated / account payment</option></select></label><label class="full">Notes<textarea id="pay-notes" rows="3"></textarea></label></div><div class="save"><button id="pay-save">Record payment</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/payments-admin.js"></script></body></html>
